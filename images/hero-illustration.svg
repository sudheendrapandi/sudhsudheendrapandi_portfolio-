<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a student working at a desk with a laptop, notebook, and a plant">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201f21"/>
      <stop offset="100%" stop-color="#0f0e0f"/>
    </linearGradient>
    <linearGradient id="heroLaptop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a393a"/>
      <stop offset="100%" stop-color="#2b292b"/>
    </linearGradient>
    <linearGradient id="heroScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9c3dd"/>
      <stop offset="100%" stop-color="#8a83a6"/>
    </linearGradient>
    <linearGradient id="heroPerson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dac3a6"/>
      <stop offset="100%" stop-color="#b89a76"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c9c3dd" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9c3dd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#heroBg)"/>
  <rect width="800" height="800" fill="url(#heroGlow)"/>

  <!-- window light shape -->
  <rect x="520" y="60" width="220" height="300" rx="12" fill="#c9c3dd" opacity="0.05"/>
  <line x1="630" y1="60" x2="630" y2="360" stroke="#c9c3dd" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="520" y1="210" x2="740" y2="210" stroke="#c9c3dd" stroke-opacity="0.12" stroke-width="2"/>

  <!-- desk -->
  <rect x="80" y="560" width="640" height="26" rx="4" fill="#363436"/>
  <rect x="120" y="586" width="18" height="140" fill="#2b292b"/>
  <rect x="660" y="586" width="18" height="140" fill="#2b292b"/>

  <!-- plant -->
  <g>
    <rect x="140" y="470" width="70" height="70" rx="10" fill="#3a393a"/>
    <path d="M175 470 C 150 430, 150 390, 175 360 C 200 390, 200 430, 175 470 Z" fill="#8a9a7c"/>
    <path d="M175 470 C 195 440, 220 420, 250 415 C 235 445, 210 465, 175 470 Z" fill="#9fae8f"/>
    <path d="M175 470 C 155 440, 130 420, 100 415 C 115 445, 140 465, 175 470 Z" fill="#7c8d6e"/>
  </g>

  <!-- laptop -->
  <g>
    <path d="M330 560 L 470 560 L 486 592 L 314 592 Z" fill="url(#heroLaptop)"/>
    <rect x="336" y="420" width="128" height="140" rx="6" fill="#201f21" stroke="#48464c" stroke-width="2"/>
    <rect x="346" y="430" width="108" height="120" rx="2" fill="url(#heroScreen)" opacity="0.85"/>
    <rect x="358" y="444" width="60" height="6" rx="3" fill="#0f0e0f" opacity="0.35"/>
    <rect x="358" y="458" width="84" height="6" rx="3" fill="#0f0e0f" opacity="0.25"/>
    <rect x="358" y="472" width="72" height="6" rx="3" fill="#0f0e0f" opacity="0.25"/>
    <rect x="358" y="492" width="40" height="30" rx="3" fill="#0f0e0f" opacity="0.2"/>
    <rect x="404" y="492" width="40" height="30" rx="3" fill="#0f0e0f" opacity="0.2"/>
  </g>

  <!-- notebook + pen -->
  <g>
    <rect x="500" y="548" width="120" height="16" rx="3" fill="#e6e1e3" opacity="0.9"/>
    <rect x="510" y="540" width="100" height="8" rx="3" fill="#c9c3dd" opacity="0.6"/>
    <line x1="516" y1="577" x2="600" y2="577" stroke="#928f97" stroke-width="1.5" opacity="0.5"/>
    <rect x="608" y="530" width="6" height="60" rx="3" fill="#dac3a6" transform="rotate(18 611 560)"/>
  </g>

  <!-- coffee cup -->
  <g>
    <rect x="240" y="540" width="34" height="34" rx="4" fill="#3a393a"/>
    <ellipse cx="257" cy="540" rx="17" ry="5" fill="#dac3a6" opacity="0.8"/>
    <path d="M274 548 q14 0 14 12 q0 12 -14 10" fill="none" stroke="#3a393a" stroke-width="4"/>
  </g>

  <!-- person, simplified seated silhouette -->
  <g>
    <circle cx="380" cy="300" r="34" fill="url(#heroPerson)"/>
    <path d="M330 300 C 330 260, 430 260, 430 300 L 430 340 C 430 340 380 350 330 340 Z" fill="#3a393a"/>
    <path d="M330 330 C 300 340, 280 380, 285 420 L 340 420 C 340 390, 345 360, 355 335 Z" fill="#2b292b"/>
    <path d="M430 330 C 460 340, 480 380, 475 420 L 420 420 C 420 390, 415 360, 405 335 Z" fill="#2b292b"/>
    <path d="M355 335 C 350 370, 345 400, 348 430 L 380 430 C 382 400, 384 365, 380 335 Z" fill="#48464c"/>
    <path d="M405 335 C 410 370, 415 400, 412 430 L 380 430 C 378 400, 376 365, 380 335 Z" fill="#48464c"/>
  </g>

  <!-- floating study icons -->
  <g opacity="0.85">
    <circle cx="640" cy="140" r="26" fill="none" stroke="#c9c3dd" stroke-width="2.5"/>
    <path d="M628 140 l8 8 l16 -18" fill="none" stroke="#c9c3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g opacity="0.7">
    <rect x="110" y="150" width="56" height="42" rx="6" fill="none" stroke="#dac3a6" stroke-width="2.5"/>
    <line x1="110" y1="166" x2="166" y2="166" stroke="#dac3a6" stroke-width="2.5"/>
  </g>
  <g opacity="0.6">
    <circle cx="700" cy="450" r="4" fill="#c9c3dd"/>
    <circle cx="730" cy="470" r="3" fill="#c9c3dd"/>
    <circle cx="680" cy="480" r="2.5" fill="#c9c3dd"/>
  </g>
</svg>
