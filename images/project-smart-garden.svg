<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a potted plant connected to a microcontroller board, representing an IoT smart garden project">
  <defs>
    <linearGradient id="sgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26312a"/>
      <stop offset="100%" stop-color="#141315"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sgBg)"/>

  <!-- desk line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#3a393a" stroke-width="2"/>

  <!-- board -->
  <g>
    <rect x="440" y="300" width="220" height="150" rx="10" fill="#1c1b1d" stroke="#48464c" stroke-width="2"/>
    <circle cx="470" cy="330" r="6" fill="#dac3a6"/>
    <circle cx="630" cy="330" r="6" fill="#dac3a6"/>
    <circle cx="470" cy="420" r="6" fill="#dac3a6"/>
    <circle cx="630" cy="420" r="6" fill="#dac3a6"/>
    <rect x="500" y="320" width="100" height="60" rx="4" fill="#2b292b"/>
    <g stroke="#c9c3dd" stroke-width="2" opacity="0.7">
      <line x1="500" y1="335" x2="480" y2="335"/>
      <line x1="500" y1="350" x2="480" y2="350"/>
      <line x1="500" y1="365" x2="480" y2="365"/>
      <line x1="600" y1="335" x2="620" y2="335"/>
      <line x1="600" y1="350" x2="620" y2="350"/>
      <line x1="600" y1="365" x2="620" y2="365"/>
    </g>
    <circle cx="550" cy="410" r="10" fill="#8fae7c"/>
  </g>

  <!-- connecting wire -->
  <path d="M440 380 C 380 380, 340 380, 300 340" fill="none" stroke="#c9c3dd" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7"/>

  <!-- pot -->
  <path d="M240 380 L 360 380 L 345 460 L 255 460 Z" fill="#3a393a"/>
  <rect x="230" y="365" width="140" height="20" rx="6" fill="#48464c"/>

  <!-- plant leaves -->
  <g>
    <path d="M300 375 C 260 320, 260 260, 300 210 C 340 260, 340 320, 300 375 Z" fill="#7c9a6c"/>
    <path d="M300 340 C 340 300, 380 280, 430 275 C 410 320, 370 350, 300 340 Z" fill="#8fae7c"/>
    <path d="M300 340 C 260 300, 220 280, 170 275 C 190 320, 230 350, 300 340 Z" fill="#6e8a60"/>
    <path d="M300 310 C 330 270, 360 250, 400 245 C 385 280, 350 305, 300 310 Z" fill="#9fbb8f"/>
  </g>

  <!-- sun glow -->
  <circle cx="660" cy="90" r="46" fill="#dac3a6" opacity="0.15"/>
  <circle cx="660" cy="90" r="26" fill="#dac3a6" opacity="0.35"/>

  <!-- floating data chips -->
  <g opacity="0.6">
    <circle cx="120" cy="120" r="3" fill="#c9c3dd"/>
    <circle cx="150" cy="150" r="2" fill="#c9c3dd"/>
    <circle cx="90" cy="160" r="2.5" fill="#c9c3dd"/>
  </g>
</svg>
